[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "damask-copilot"
version = "0.1.0"
description = "Minimal MCP servers for safe DAMASK pre- and post-processing helpers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp",
  "pydantic",
  "pyyaml",
  "langgraph",
  "openai",
  "numpy",
  "scipy",
  "h5py",
  "pandas",
  "vtk",
  "matplotlib",
]

[project.scripts]
damask-copilot = "damask_copilot.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
